<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kartik Nadar — Video Portfolio</title>
<meta name="description" content="Kartik Nadar — videographer and reel editor for salons, gyms, restaurants and brands.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:ital,wght@1,500&family=Cabin:wght@400;500&family=Mulish:wght@800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#f5ead6;        /* cream headings */
    --body:#dcab97;       /* soft peach body text */
    --mute:#8f8279;
    --line:rgba(243,233,220,.14);
    --display:Anton,'Arial Black',Impact,sans-serif;
    --italic:'Barlow Condensed','Arial Narrow',sans-serif;
    --text:Cabin,'Segoe UI',sans-serif;
    --label:Mulish,'Arial Black',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    color:var(--ink);font-family:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
    background-color:#050505;
    /* black satin look */
    background-image:
      radial-gradient(120% 60% at 15% 10%, rgba(255,255,255,.07), transparent 55%),
      radial-gradient(90% 50% at 85% 35%, rgba(255,255,255,.05), transparent 60%),
      radial-gradient(110% 55% at 30% 70%, rgba(255,255,255,.045), transparent 60%),
      radial-gradient(80% 45% at 80% 92%, rgba(255,255,255,.05), transparent 60%),
      linear-gradient(115deg, transparent 0 40%, rgba(255,255,255,.035) 48%, transparent 56%),
      linear-gradient(160deg, transparent 0 62%, rgba(255,255,255,.03) 70%, transparent 78%);
    background-attachment:fixed;
  }
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1180px;margin:0 auto;padding:0 32px}
  .pg{display:block;text-align:center;font-size:13px;letter-spacing:1px;color:var(--mute);padding:28px 0}

  /* ---------- cover ---------- */
  .cover{min-height:100vh;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:60px 0;border-bottom:1px solid var(--line)}
  .cover .kick{font-family:var(--label);font-weight:800;font-size:13px;letter-spacing:5px;text-transform:uppercase;color:var(--body);margin-bottom:22px}
  .cover h1{font-family:var(--display);font-weight:700;text-transform:uppercase;line-height:.86;font-size:clamp(56px,15vw,210px);letter-spacing:.5px}
  .cover h1 i{font-family:var(--italic);font-style:italic;font-weight:500;text-transform:none;font-size:.32em;letter-spacing:0;vertical-align:.15em;margin:0 .1em}
  .cover p{max-width:620px;margin:28px auto 0;color:var(--body);font-size:16px}
  .cover .meta{display:flex;justify-content:center;flex-wrap:wrap;gap:10px 26px;margin-top:34px;font-family:var(--label);font-weight:800;font-size:13px;letter-spacing:1px;text-transform:uppercase}
  .cover .meta a{color:var(--body);border-bottom:1px solid transparent}
  .cover .meta a:hover{border-color:var(--body)}

  /* ---------- contents ---------- */
  .contents{padding:40px 0 90px;border-bottom:1px solid var(--line)}
  .contents h2{font-family:var(--display);font-weight:700;font-size:clamp(56px,9vw,120px);text-transform:uppercase;line-height:.9;margin-bottom:40px}
  .toc{display:grid;grid-template-columns:repeat(2,1fr);column-gap:48px}
  .toc a{display:flex;align-items:baseline;gap:16px;padding:22px 0;border-top:1px solid var(--line)}
  .toc .n{font-size:13px;color:var(--mute)}
  .toc .t{font-family:var(--display);font-weight:700;font-size:38px;text-transform:uppercase;line-height:1}
  .toc .c{margin-left:auto;font-size:13px;color:var(--body)}
  .about{display:grid;grid-template-columns:1fr 1fr;gap:56px;margin-top:70px}
  .label{font-family:var(--label);font-weight:900;font-size:15px;letter-spacing:.3px;text-transform:uppercase;color:var(--ink);margin:0 0 10px}
  .txt p{color:var(--body);font-size:15px;margin-bottom:14px}
  .credits{font-family:var(--label);font-weight:800;font-size:14px;text-transform:uppercase;color:var(--body);letter-spacing:.2px}
  .credits span+span:before{content:"I";margin:0 10px;color:var(--mute);font-weight:400}

  /* ---------- category sections ---------- */
  .cat{padding:10px 0 40px;border-bottom:1px solid var(--line);scroll-margin-top:0}
  .cat-title{font-family:var(--display);font-weight:700;text-transform:uppercase;line-height:.88;font-size:clamp(46px,12.5vw,170px);margin:10px 0 44px}
  .cat-title i{font-family:var(--italic);font-style:italic;font-weight:500;text-transform:none;font-size:.32em;vertical-align:.12em;margin:0 .08em}
  .cat.center .cat-title{text-align:center}
  .cat-head{display:grid;grid-template-columns:1.1fr 1fr;gap:56px;margin-bottom:48px}
  .cat.center .cat-head{grid-template-columns:1fr;max-width:760px;margin-left:auto;margin-right:auto}
  .stats{display:flex;gap:34px;flex-wrap:wrap;margin-top:6px}
  .stats div{font-size:13px;color:var(--mute);text-transform:uppercase;letter-spacing:1px}
  .stats b{display:block;font-family:var(--display);font-weight:700;font-size:46px;line-height:1;color:var(--ink);letter-spacing:.5px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:18px}
  .reel{background:#0d0d0d;border:1px solid var(--line);border-radius:4px;overflow:hidden}
  .reel-top{display:flex;justify-content:space-between;align-items:baseline;padding:12px 14px}
  .reel-top h3{font-family:var(--label);font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.3px}
  .reel-top span{font-size:12px;color:var(--mute)}
  .embed{background:#fafafa;min-height:580px;display:flex;align-items:center;justify-content:center}
  .embed .ph{color:#888;font-size:13px}
  .embed blockquote.instagram-media{margin:0!important;min-width:0!important;width:100%!important;max-width:100%!important;border:0!important;border-radius:0!important;box-shadow:none!important}
  .reel-res{display:flex;gap:18px;padding:10px 14px 12px;font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.5px}
  .reel-res b{color:var(--ink);font-size:15px;margin-right:4px;letter-spacing:0}
  .reel-res:empty{display:none}

  /* ---------- contact ---------- */
  .contact{text-align:center;padding:20px 0 90px}
  .contact h2{font-family:var(--display);font-weight:700;text-transform:uppercase;line-height:.88;font-size:clamp(46px,12.5vw,180px)}
  .contact h2 i{font-family:var(--italic);font-style:italic;font-weight:500;text-transform:none;font-size:.32em;vertical-align:.12em}
  .contact p{color:var(--body);max-width:520px;margin:22px auto 34px}
  .clist{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));max-width:880px;margin:0 auto;border-top:1px solid var(--line)}
  .clist a{padding:24px 10px;border-bottom:1px solid var(--line)}
  .clist .label{margin:0 0 6px;color:var(--mute);font-size:12px;letter-spacing:2px}
  .clist .v{font-family:var(--label);font-weight:800;font-size:16px;color:var(--ink);word-break:break-all}
  .clist a:hover .v{color:var(--body)}
  footer{text-align:center;color:var(--mute);font-size:12px;padding:0 0 30px}

  @media (max-width:860px){
    .wrap{padding:0 16px}
    .about,.cat-head{grid-template-columns:1fr;gap:28px}
    .grid{grid-template-columns:1fr}
    .toc{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<!--
  =====================================================================
  EDIT HERE — the whole page is built from PROFILE and SECTIONS below.
  • Rename any reel (title).
  • Add real results per reel: views / likes / shares (numbers only).
    Section totals are calculated automatically and only show when filled.
  • Add client names to "clients" to show a CLIENT CREDITS line.
  Videos use Instagram's official embed, so they play in Instagram's own
  original quality — nothing is downloaded, re-uploaded or compressed.

-->
<script>
const PROFILE = {

    ],
    clients: [],
    reels: [

    ]
  },

    approach: [
      "Beat-synced cuts match every rep and lift to the music.",
      "Low angles and slow-motion moments make strength and effort look powerful.",
      "Real members and trainers in frame build trust in the space and the community."
    ],
    clients: [],
    reels: [

      { id: "DRWQMbMCLy2", title: "Gym Reel 02", views: null, likes: null, shares: null },

    approach: [
      "Macro shots of texture, steam, sizzle and pours bring out the appetite appeal of every dish.",

    ],
    clients: [],
    reels: [
      { id: "DW1MLu8DMiS", title: "Restaurant Reel 01", views: null, likes: null, shares: null },
      { id: "DVyoBtcDC2G", title: "Restaurant Reel 02", views: null, likes: null, shares: null },
      { id: "DVsuHOjDB4u", title: "Restaurant Reel 03", views: null, likes: null, shares: null },
      { id: "DNXelhMsXWs", title: "Restaurant Reel 04", views: null, likes: null, shares: null },
      { id: "DMevyZXzLmR", title: "Restaurant Reel 05", views: null, likes: null, shares: null },
      { id: "DVtKa9OIph2", title: "Restaurant Reel 06", views: null, likes: null, shares: null },
      { id: "DYwyJigoFrm", title: "Restaurant Reel 07", views: null, likes: null, shares: null },
      { id: "DXL_5upDO6M", title: "Restaurant Reel 08", views: null, likes: null, shares: null },

    ],
    clients: [],
    reels: [
      { id: "Dcv8ZqIN2d2", title: "Freelance Reel 01", views: null, likes: null, shares: null },

<header class="cover" id="top"><div class="wrap">
  <div class="kick" id="role"></div>
  <h1 id="name"></h1>
  <p id="intro"></p>
  <div class="meta" id="meta"></div>
</div></header>

<section class="contents"><div class="wrap">
  <span class="pg">01</span>
  <h2>Contents</h2>
  <nav class="toc" id="toc"></nav>
  <div class="about">
    <div class="txt">
      <div class="label">About me</div>
      <div id="about"></div>
    </div>
    <div class="txt">
      <div class="label">What I do</div>
      <p class="credits" id="services"></p>
      <div class="label" style="margin-top:34px">Portfolio in numbers</div>
      <div class="stats" id="allstats"></div>
    </div>
  </div>
</div></section>

<main id="work"></main>

<section class="contact" id="contact"><div class="wrap">
  <span class="pg" id="lastpg"></span>
  <h2>Let's <i>work</i> together</h2>
  <p>Running a salon, gym, restaurant or brand? Let's turn it into reels people actually watch.</p>
  <div class="clist" id="clist"></div>
</div></section>
<footer id="foot"></footer>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const fmt = n => n>=1e6 ? (n/1e6).toFixed(n>=1e7?0:1).replace(/\.0$/,'')+'M' : n>=1e3 ? (n/1e3).toFixed(n>=1e4?0:1).replace(/\.0$/,'')+'K' : String(n);
  const sum = (a,k) => a.reduce((s,r)=>s+(Number(r[k])||0),0);
  const pad = n => String(n).padStart(2,'0');
  const P = PROFILE;

  $('role').textContent = P.role;
  $('name').innerHTML = esc(P.first)+'<br>'+esc(P.last);
  $('intro').textContent = P.intro;
  $('about').innerHTML = P.about.map(p=>'<p>'+esc(p)+'</p>').join('');
  $('services').innerHTML = P.services.map(s=>'<span>'+esc(s)+'</span>').join('');

  const tel = P.phone.replace(/[^\d+]/g,'');
  $('meta').innerHTML = '<a href="tel:'+tel+'">'+esc(P.phone)+'</a><a href="mailto:'+esc(P.email)+'">'+esc(P.email)+'</a><a href="'+esc(P.linkedin)+'" target="_blank" rel="noopener">LinkedIn</a>';
  $('clist').innerHTML =
    '<a href="tel:'+tel+'"><div class="label">Phone</div><div class="v">'+esc(P.phone)+'</div></a>'+
    '<a href="mailto:'+esc(P.email)+'"><div class="label">Email</div><div class="v">'+esc(P.email)+'</div></a>'+
    '<a href="'+esc(P.linkedin)+'" target="_blank" rel="noopener"><div class="label">LinkedIn</div><div class="v">Kartik Nadar</div></a>';
  $('foot').textContent = '© '+new Date().getFullYear()+' '+P.first+' '+P.last;

  // overall numbers — only real, filled-in values are shown
  const all = SECTIONS.flatMap(s=>s.reels);
  const tv=sum(all,'views'), tl=sum(all,'likes'), ts=sum(all,'shares');
  const st=[[all.length,'Reels'],[SECTIONS.length,'Industries']];
  if(tv) st.push([fmt(tv)+'+','Total views']);
  if(tl) st.push([fmt(tl)+'+','Total likes']);
  if(ts) st.push([fmt(ts)+'+','Total shares']);
  $('allstats').innerHTML = st.map(s=>'<div><b>'+s[0]+'</b>'+s[1]+'</div>').join('');

  $('toc').innerHTML = SECTIONS.map((s,i)=>'<a href="#'+s.key+'"><span class="n">'+pad(i+2)+'</span><span class="t">'+esc(s.title)+'</span><span class="c">'+s.reels.length+' reels</span></a>').join('');

  let n=0;
  $('work').innerHTML = SECTIONS.map((s,i)=>{
    const center = i%2===1;
    const title = esc(s.title)+(s.title2?' <i>'+esc(s.connector||'and')+'</i> '+esc(s.title2):'');
    const v=sum(s.reels,'views'), l=sum(s.reels,'likes'), sh=sum(s.reels,'shares');
    const stats=['<div><b>'+s.reels.length+'</b>Reels</div>'];
    if(v) stats.push('<div><b>'+fmt(v)+'</b>Views</div>');
    if(l) stats.push('<div><b>'+fmt(l)+'</b>Likes</div>');
    if(sh) stats.push('<div><b>'+fmt(sh)+'</b>Shares</div>');
    const credits = s.clients && s.clients.length ? '<div class="label" style="margin-top:26px">Client credits:</div><p class="credits">'+s.clients.map(c=>'<span>'+esc(c)+'</span>').join('')+'</p>' : '';
    const cards = s.reels.map(r=>{
      n++;
      const res=[];
      if(r.views) res.push('<span><b>'+fmt(r.views)+'</b>views</span>');
      if(r.likes) res.push('<span><b>'+fmt(r.likes)+'</b>likes</span>');
      if(r.shares) res.push('<span><b>'+fmt(r.shares)+'</b>shares</span>');
      return '<article class="reel"><div class="reel-top"><h3>'+esc(r.title)+'</h3><span>'+pad(n)+'</span></div>'+
        '<div class="embed" data-id="'+esc(r.id)+'"><div class="ph">Loading reel…</div></div><div class="reel-res">'+res.join('')+'</div></article>';
    }).join('');
    return '<section class="cat'+(center?' center':'')+'" id="'+s.key+'"><div class="wrap">'+
      '<span class="pg">'+pad(i+2)+'</span>'+
      '<h2 class="cat-title">'+title+'</h2>'+
      '<div class="cat-head">'+
        '<div class="txt"><p>'+esc(s.intro)+'</p><div class="label" style="margin-top:22px">Results:</div><div class="stats">'+stats.join('')+'</div></div>'+
        '<div class="txt"><div class="label">Video descriptions</div>'+s.approach.map(a=>'<p>'+esc(a)+'</p>').join('')+credits+'</div>'+
      '</div>'+
      '<div class="grid">'+cards+'</div></div></section>';
  }).join('');
  $('lastpg').textContent = pad(SECTIONS.length+2);

  // Lazy-load Instagram's official embeds (cover shows first, plays in original quality)
  let loaded=false;
  const proc=()=>{ if(window.instgrm) window.instgrm.Embeds.process(); };
  function loadScript(){ if(loaded){proc();return;} loaded=true; const sc=document.createElement('script'); sc.async=true; sc.src='https://www.instagram.com/embed.js'; sc.onload=proc; document.body.appendChild(sc); }
  function mount(el){
    const url='https://www.instagram.com/reel/'+el.dataset.id+'/';
    el.innerHTML='<blockquote class="instagram-media" data-instgrm-permalink="'+url+'" data-instgrm-version="14"><a href="'+url+'" target="_blank" rel="noopener" style="color:#888;font-size:13px">Watch on Instagram</a></blockquote>';
    loadScript();
  }
  const io='IntersectionObserver' in window ? new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ io.unobserve(e.target); mount(e.target); } }),{rootMargin:'700px 0px'}) : null;
  document.querySelectorAll('.embed').forEach(el=> io ? io.observe(el) : mount(el));
})();
</script>
</body>
</html>
